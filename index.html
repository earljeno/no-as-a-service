<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>No as a Service</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .rejection-font { font-family: 'Playfair Display', serif; }
        
        /* Shake animation */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-2px); }
            20%, 40%, 60%, 80% { transform: translateX(2px); }
        }
        .shake-active { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }

        /* Custom Scrollbar for history panel */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #c7c7cc; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #a1a1aa; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen flex flex-col items-center justify-center p-6 relative overflow-x-hidden">

    <div class="w-full max-w-2xl relative z-10">
        
        <div class="sm:mx-auto sm:w-full sm:max-w-md text-center mb-10">
            <h2 class="text-3xl font-extrabold text-indigo-600 tracking-tight">no-as-a-service<span class="text-gray-900"></span></h2>
            <p class="mt-2 text-sm text-gray-600">
                Generate a professional, firm, or creative rejection instantly.
            </p>
        </div>

        <div class="bg-white rounded-2xl shadow-xl shadow-indigo-100/50 border border-gray-200 p-8 sm:p-12 relative overflow-hidden">
            
            <div class="absolute -top-6 -left-4 text-gray-50 text-8xl font-serif select-none pointer-events-none">“</div>
                <div class="absolute -bottom-10 -right-4 text-gray-50 text-8xl font-serif select-none pointer-events-none transform rotate-180">“</div>
            
                <div class="relative z-10 mb-10">
                <div id="output-container" class="min-h-[140px] flex items-center justify-center text-center p-4">
                    <p id="output-text" class="rejection-font text-2xl sm:text-3xl text-gray-400 leading-snug italic transition-all duration-300">
                        Tap below to decline...
                    </p>
                </div>
            </div>

            <div class="flex flex-col items-center space-y-6">
                
                <button id="generate-btn" 
                    class="group relative w-full sm:w-64 py-4 px-6 bg-indigo-600 text-white rounded-xl font-semibold shadow-lg shadow-indigo-500/30 hover:bg-indigo-700 hover:shadow-indigo-600/40 hover:-translate-y-0.5 active:translate-y-0 transition-all duration-200 overflow-hidden">
                    <span id="btn-content" class="relative z-10 flex items-center justify-center">
                        <span>Generate Rejection</span>
                        <svg class="w-5 h-5 ml-2 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"></path></svg>
                    </span>
                    <div id="btn-spinner" class="absolute inset-0 z-20 flex items-center justify-center bg-indigo-700 hidden">
                        <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                    </div>
                </button>

                <div class="flex flex-wrap justify-center items-center gap-4 text-sm">
                    <button onclick="handleCopy(document.getElementById('output-text').textContent)" class="flex items-center text-gray-500 hover:text-indigo-600 transition-colors">
                        <svg class="w-4 h-4 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg>
                        Copy
                    </button>
                    <span class="text-gray-300 hidden sm:inline">|</span>
                    <button onclick="toggleHistory()" class="flex items-center text-gray-500 hover:text-indigo-600 transition-colors">
                        <svg class="w-4 h-4 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        History <span id="history-count" class="ml-1 text-xs bg-gray-100 text-gray-600 px-1.5 py-0.5 rounded-full hidden">0</span>
                    </button>
                </div>

            </div>
        </div>

        <p class="mt-8 text-center text-xs text-gray-400">
            Powered by no-as-a-service &bull; 100% Denial Rate
        </p>
    </div>

    <div id="history-modal" class="fixed inset-0 z-50 hidden" aria-labelledby="modal-title" role="dialog" aria-modal="true">
        <div class="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity backdrop-blur-sm" onclick="toggleHistory()"></div>

        <div class="fixed inset-y-0 right-0 max-w-full flex pl-10">
            <div class="w-screen max-w-md transform transition ease-in-out duration-500 sm:duration-700 translate-x-full" id="history-panel">
                <div class="h-full flex flex-col bg-white shadow-xl overflow-y-scroll">
                    
                    <div class="px-6 py-6 border-b border-gray-200 flex items-center justify-between">
                        <h3 class="text-lg font-bold text-gray-900" id="modal-title">Recent Rejections</h3>
                        <button onclick="toggleHistory()" class="text-gray-400 hover:text-gray-500 focus:outline-none">
                            <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
                        </button>
                    </div>

                    <div class="relative flex-1 px-6 py-6">
                        <ul id="history-list" class="space-y-4">
                            <li id="empty-history" class="text-center py-10">
                                <svg class="mx-auto h-12 w-12 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                <p class="mt-2 text-sm text-gray-500">No rejections generated yet.</p>
                            </li>
                        </ul>
                    </div>
                    
                    <div class="border-t border-gray-200 px-6 py-4 bg-gray-50">
                        <button onclick="clearHistory()" class="w-full text-center text-sm text-red-600 hover:text-red-800 font-medium">Clear History</button>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <div id="toast" class="fixed top-5 right-5 bg-gray-900 text-white px-4 py-3 rounded-lg shadow-lg transform translate-y-[-150%] transition-transform duration-300 flex items-center gap-3 z-[60]">
        <svg class="w-5 h-5 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
        <p class="font-medium text-sm">Copied to clipboard!</p>
    </div>

    <script type="module" src="/static/auth-ui.js"></script>
    <script type="module" src="/static/app.js" async></script>
</body>
</html>
